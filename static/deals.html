<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Public Deal Records — CraftMC</title>
<link rel="stylesheet" href="/static/style.css" />
<style>
  body { background: #faf9f5; }
  .wrap { max-width: 920px; margin: 0 auto; padding: 28px 20px 60px; }
  .topbar { display:flex; align-items:center; gap:10px; margin-bottom: 18px; }
  .brand { font-family: "Tiempos Headline","Source Serif Pro",Georgia,serif; font-size:22px; }
  .brand .dot { color: var(--accent); }
  .nav-link { color: var(--text-muted); font-size: 13px; }
  h1 { font-family: "Tiempos Headline","Source Serif Pro",Georgia,serif; font-size: 28px; margin: 0 0 6px; }
  .sub { color: var(--text-muted); margin-bottom: 18px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } }
  .deal { transition: transform .15s, box-shadow .15s; }
  .deal:hover { transform: translateY(-1px); box-shadow: 0 4px 14px rgba(0,0,0,.05); }
  .pill { display:inline-block; padding:2px 10px; border-radius:999px; font-size:11px; border:1px solid var(--border-strong); }
  .pill.signed { background:#effaf2; border-color:#cfe6d5; color:var(--ok); }
  .pill.partial { background:#fbf4dc; border-color:#ecddb1; color:var(--warn); }
  .pill.rejected { background:#fbecea; border-color:#e6c2c0; color:var(--err); }
  .pill.pending { background:#f0ebe1; }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="brand">CraftMC<span class="dot">.</span></div>
    <span style="flex:1"></span>
    <a href="/login" class="nav-link">Manager login →</a>
  </div>

  <h1>Public Deal Records</h1>
  <p class="sub">Open ledger of in-game deals. Anyone can create one; parties sign or reject it from inside the Minecraft server using the <span class="kbd">/sign</span> command.</p>

  <div class="grid">
    <div>
      <h2 style="font-size:16px;margin:6px 0 10px">All records</h2>
      <div id="list" class="card" style="padding:0;overflow:hidden">
        <div style="padding:14px" class="muted">Loading…</div>
      </div>
    </div>

    <div>
      <h2 style="font-size:16px;margin:6px 0 10px">Create a new deal</h2>
      <form id="newForm" class="card" autocomplete="off">
        <div class="field">
          <label>Title</label>
          <input id="title" required maxlength="200" placeholder="Trade 5 diamonds for villager spawner"/>
        </div>
        <div class="field">
          <label>Parties (comma-separated Minecraft usernames)</label>
          <input id="parties" required placeholder="Alice_, Bob_42"/>
        </div>
        <div class="field">
          <label>Body / terms</label>
          <textarea id="body" rows="6" placeholder="Both parties agree that..."></textarea>
        </div>
        <div class="field">
          <label>Created by (optional)</label>
          <input id="by" maxlength="40" placeholder="Your name (free text)"/>
        </div>
        <button class="primary" type="submit">Create unsigned deal</button>
        <div id="msg" class="muted" style="margin-top:10px"></div>
      </form>
    </div>
  </div>
</div>
<script>
const list = document.getElementById('list');
const escapeHtml = s => (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

async function loadList() {
  try {
    const r = await fetch('/mcsapi/record/list');
    const j = await r.json();
    const records = j.records || [];
    if (!records.length) {
      list.innerHTML = '<div style="padding:14px" class="muted">No records yet. Create the first one →</div>';
      return;
    }
    list.innerHTML = records.map(rec => {
      const status = rec.status;
      const created = new Date(rec.created_at).toLocaleString();
      const by = rec.created_by ? ` by ${escapeHtml(rec.created_by)}` : '';
      return `<a href="/deals/${encodeURIComponent(rec.id)}" class="deal" style="display:block;padding:12px 14px;border-bottom:1px solid var(--border);text-decoration:none;color:var(--text)">
        <div style="display:flex;align-items:center;gap:8px">
          <div style="font-weight:500;flex:1">${escapeHtml(rec.title)}</div>
          <span class="pill ${status}">${status}</span>
        </div>
        <div class="muted" style="font-size:12px;margin-top:2px">
          #${escapeHtml(rec.id)} · ${escapeHtml(rec.parties.join(', '))} · ${created}${by}
        </div>
      </a>`;
    }).join('');
  } catch (e) {
    list.innerHTML = '<div style="padding:14px;color:var(--err)">Failed to load: '+escapeHtml(e.message)+'</div>';
  }
}
loadList();

document.getElementById('newForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const v = id => document.getElementById(id).value;
  const parties = v('parties').split(',').map(s => s.trim()).filter(Boolean);
  const body = { title: v('title'), body: v('body'), parties, by: v('by') || null };
  const msg = document.getElementById('msg');
  try {
    const r = await fetch('/mcsapi/record/create', { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify(body) });
    const j = await r.json();
    if (!r.ok) { msg.style.color = 'var(--err)'; msg.textContent = j.error || 'Failed'; return; }
    location.href = '/deals/' + encodeURIComponent(j.record.id);
  } catch (err) {
    msg.style.color = 'var(--err)'; msg.textContent = err.message;
  }
});
</script>
</body></html>
